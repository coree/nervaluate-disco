[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "nervaluate-disco"
version = "2.0.0"
authors = [
    { name="Cornelius"},
]
description = "NER evaluation for discontinuous and overlapping entities with character-level precision"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["named-entity-recognition", "ner", "evaluation-metrics", "discontinuous-entities", "overlapping-entities", "nlp"]
license = {text = "MIT License"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "coverage>=7.8.0",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
]

[project.urls]
"Homepage" = "https://github.com/coree/nervaluate-disco"
"Bug Tracker" = "https://github.com/coree/nervaluate-disco/issues"
"Original Project" = "https://github.com/MantisAI/nervaluate"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=nervaluate --cov-report=term-missing"

[tool.coverage.run]
source = ["nervaluate"]
omit = ["*__init__*"]

[tool.coverage.report]
show_missing = true
precision = 2
sort = "Miss"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true